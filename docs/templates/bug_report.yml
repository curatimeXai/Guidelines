name: Bug Report
description: Create a standardized bug report matching the QA tracking template
title: "[BUG]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Please fill in the fields below to ensure clear reproduction steps and prioritization for developers.
  - type: textarea
    id: summary
    attributes:
      label: Summary
      description: Provide a clear and concise description of the bug.
    validations:
      required: true
  - type: dropdown
    id: component
    attributes:
      label: Component
      description: Which area or module is affected?
      options:
        - "-"
        - Auth / Login
        - Backend / API
        - UI / UX
        - Progress
        - Assessment / Practice
        - Database / Infrastructure
    validations:
      required: true
  - type: textarea
    id: preconditions
    attributes:
      label: Preconditions
      description: Prerequisites needed before executing the steps (e.g. user logged in, backend running, specific user role).
      placeholder: |
        - Backend is running
        - User is logged in
    validations:
      required: false
  - type: textarea
    id: steps
    attributes:
      label: Steps to Reproduce
      description: Detail the exact sequence of actions to reproduce the bug.
      placeholder: |
        1. Go to '...'
        2. Click on '....'
        3. Observe error
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected Result
      description: What should happen according to specifications?
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual Result
      description: What actually happened? (Include exact error messages/status codes if applicable)
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment & Test Data
      description: OS, browser version, device, endpoint, payload, or branch.
      placeholder: "Localhost | Windows 11 Home | Chrome 131.0 | Postman app"
    validations:
      required: false
  - type: textarea
    id: notes
    attributes:
      label: Additional Notes
      description: Workarounds, suggested fixes, screenshots, or logs.
    validations:
      required: false
